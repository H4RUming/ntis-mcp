# 설정 파일 예시. 이 파일을 config.toml 로 복사해 값을 채운다(config.toml 은 git 에 올라가지 않는다).
#   cp config.example.toml config.toml && chmod 600 config.toml
# 다른 위치의 파일을 쓰려면 환경변수 RND_CONFIG 또는 각 서버의 --config 로 경로를 준다.

[ntis]
# NTIS OpenAPI 승인키 (ntis.go.kr → 데이터활용 → OpenAPI 에서 발급).
# 비워 두면 NTIS 서버는 뜨지만 모든 도구가 "키가 등록되지 않았다"고 답한다.
# 환경변수 NTIS_API_KEY 가 있으면 그 값이 우선한다.
api_key = ""

# true 이면 NTIS 가 대외 서비스(웹·모바일)에 허용한 항목만 돌려준다.
# 그 밖의 항목(연구목표·기대효과·참여연구원·분류코드 등)은 NTIS 과제 상세 페이지 링크로 대신한다.
external_use = true

# 요청 사이 최소 간격(초), 제한 시간(초), 같은 요청 결과를 다시 쓰는 시간(초)
delay = 0.3
timeout = 20
cache_ttl = 600

[terms]
# 과제 키워드 색인: 검색어와 뜻이 가까운, 실제 과제에 쓰인 말을 찾아 검색 결과에 함께 준다(python -m ntis.terms 참고).
# 임베딩은 이 주소(OpenAI 호환 /v1/embeddings)에 맡긴다. 비워 두면 색인을 쓰지 않는다.
embed_url = ""              # 예: "http://127.0.0.1:8770/v1/embeddings"
model = ""                  # 임베딩 서버가 모델 이름을 요구하면 적는다
dimensions = 256            # 벡터 차원(모델이 앞쪽만 잘라 써도 되게 학습된 경우에만 줄인다)
floor = 0.0                 # 이보다 덜 가까운 말은 추천하지 않는다. 값은 모델마다 다르다(EmbeddingGemma 는 0.9 쯤)
# data = "data/terms"       # 키워드와 색인을 두는 폴더(설정 파일 기준)
